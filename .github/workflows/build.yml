name: Build GUI

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-python-numpy
            mingw-w64-x86_64-python-pillow

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Convert PNG to ICO
        run: python -c "from PIL import Image; Image.open('gui/homm3data.png').save('gui/homm3data.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build with PyInstaller
        run: pyinstaller gui/build/homm3data-onefile.spec --noconfirm --distpath dist --workpath build/tmp

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: homm3data-windows
          path: dist/homm3data.exe

